name: Build installable plugin ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-installable-zip.yml'
      - 'assets/**'
      - 'includes/**'
      - 'composer.json'
      - 'shipping-cost-monitor-for-woocommerce.php'
      - 'uninstall.php'
      - 'readme.txt'
      - 'changelog.txt'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  php-compatibility:
    name: PHP ${{ matrix.php }} dependency, lint and autoload checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install Composer autoloader
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --classmap-authoritative

      - name: Lint plugin and generated PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l shipping-cost-monitor-for-woocommerce.php
          php -l uninstall.php
          find includes vendor -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l

      - name: Verify Composer PSR-4 autoload
        run: |
          php -r 'require "vendor/autoload.php"; if (!class_exists("WPEssential\\ShippingCostMonitor\\Plugin")) { fwrite(STDERR, "PSR-4 autoload smoke failed\\n"); exit(1); } echo "PSR-4 autoload smoke passed\\n";'

  build:
    name: Lint, build and upload ZIP
    needs: php-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer autoloader
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --classmap-authoritative

      - name: Lint plugin and generated PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l shipping-cost-monitor-for-woocommerce.php
          php -l uninstall.php
          find includes vendor -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l

      - name: Verify Composer PSR-4 autoload
        run: |
          php -r 'require "vendor/autoload.php"; if (!class_exists("WPEssential\\ShippingCostMonitor\\Plugin")) { fwrite(STDERR, "PSR-4 autoload smoke failed\n"); exit(1); } echo "PSR-4 autoload smoke passed\n";'

      - name: Package installable plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          slug='shipping-cost-monitor-for-woocommerce'
          archive="${slug}.zip"
          rm -rf build "$archive" "$archive.sha256"
          package_dir="build/${slug}"
          mkdir -p "$package_dir"
          cp -R assets includes vendor "$package_dir/"
          plugin_version="$(sed -n 's/^ \* Version: *//p' shipping-cost-monitor-for-woocommerce.php)"
          stable_tag="$(sed -n 's/^Stable tag: *//p' readme.txt)"
          if [ -z "$plugin_version" ] || [ "$plugin_version" != "$stable_tag" ]; then
            echo "Plugin Version ($plugin_version) and readme Stable tag ($stable_tag) differ" >&2
            exit 1
          fi
          cp shipping-cost-monitor-for-woocommerce.php uninstall.php readme.txt changelog.txt LICENSE "$package_dir/"
          printf '%s\n' "$GITHUB_SHA" > "$package_dir/BUILD-ID.txt"
          if [ -d languages ]; then cp -R languages "$package_dir/languages"; fi
          (cd build && zip -qr "../${archive}" "$slug")
          unzip -t "$archive"
          sha256sum "$archive" > "${archive}.sha256"

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: shipping-cost-monitor-for-woocommerce-${{ github.sha }}
          path: |
            shipping-cost-monitor-for-woocommerce.zip
            shipping-cost-monitor-for-woocommerce.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
