name: Build installable plugin ZIPs (Free + Pro)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-installable-zip.yml'
      - 'assets/**'
      - 'includes/**'
      - 'pro/**'
      - 'composer.json'
      - 'shipping-cost-monitor-for-woocommerce.php'
      - 'uninstall.php'
      - 'readme.txt'
      - 'changelog.txt'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  php-compatibility:
    name: PHP ${{ matrix.php }} dependency, lint and autoload checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install Composer autoloaders (Free and Pro)
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --classmap-authoritative
          composer install --working-dir=pro --no-dev --prefer-dist --no-interaction --no-progress --classmap-authoritative

      - name: Lint Free and Pro PHP
        shell: bash
        run: |
          set -euo pipefail
          find shipping-cost-monitor-for-woocommerce.php includes vendor pro -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l

      - name: Verify Composer PSR-4 autoload
        run: |
          php -r 'define("ABSPATH", __DIR__ . "/"); require "vendor/autoload.php"; require "pro/vendor/autoload.php"; foreach (array("WPEssential\\ShippingCostMonitor\\Plugin", "WPEssential\\ShippingCostMonitorPro\\Plugin", "WPEssential\\ShippingCostMonitorPro\\Admin\\InvoiceImporter") as $c) { if (!class_exists($c)) { fwrite(STDERR, "PSR-4 autoload smoke failed: $c\n"); exit(1); } } echo "PSR-4 autoload smoke passed\n";' | tee /tmp/smoke.txt
          grep -q "PSR-4 autoload smoke passed" /tmp/smoke.txt

  build:
    name: Build and upload Free and Pro ZIPs
    needs: php-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer autoloaders (Free and Pro)
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --classmap-authoritative
          composer install --working-dir=pro --no-dev --prefer-dist --no-interaction --no-progress --classmap-authoritative

      - name: Check versions match
        shell: bash
        run: |
          set -euo pipefail
          free_version="$(sed -n 's/^ \* Version: *//p' shipping-cost-monitor-for-woocommerce.php)"
          stable_tag="$(sed -n 's/^Stable tag: *//p' readme.txt)"
          pro_version="$(sed -n 's/^ \* Version: *//p' pro/shipping-cost-monitor-pro-for-woocommerce.php)"
          pro_constant="$(sed -n "s/^define( 'WPE_SCM_PRO_VERSION', '\(.*\)' );/\1/p" pro/shipping-cost-monitor-pro-for-woocommerce.php)"
          free_constant="$(sed -n "s/^define( 'WPE_SCM_VERSION', '\(.*\)' );/\1/p" shipping-cost-monitor-for-woocommerce.php)"
          echo "Free $free_version (constant $free_constant, readme $stable_tag); Pro $pro_version (constant $pro_constant)"
          if [ -z "$free_version" ] || [ "$free_version" != "$stable_tag" ] || [ "$free_version" != "$free_constant" ]; then
            echo "Free plugin Version, WPE_SCM_VERSION and readme Stable tag must match" >&2
            exit 1
          fi
          if [ -z "$pro_version" ] || [ "$pro_version" != "$pro_constant" ]; then
            echo "Pro plugin Version and WPE_SCM_PRO_VERSION must match" >&2
            exit 1
          fi

      - name: Check the Free package contains no Pro code
        shell: bash
        run: |
          set -euo pipefail
          if grep -rlE --exclude-dir=docs 'ShippingCostMonitorPro|wpe_scm_shipstation|wpe_scm_commit_invoice_rows|api\.shipstation\.com' shipping-cost-monitor-for-woocommerce.php includes assets; then
            echo "Pro code found in the Free plugin files above" >&2
            exit 1
          fi

      - name: Package Free ZIP
        shell: bash
        run: |
          set -euo pipefail
          slug='shipping-cost-monitor-for-woocommerce'
          package_dir="build/${slug}"
          rm -rf build "${slug}.zip"
          mkdir -p "$package_dir"
          cp -R assets includes vendor "$package_dir/"
          cp shipping-cost-monitor-for-woocommerce.php uninstall.php readme.txt changelog.txt LICENSE composer.json "$package_dir/"
          printf '%s\n' "$GITHUB_SHA" > "$package_dir/BUILD-ID.txt"
          if [ -d languages ]; then cp -R languages "$package_dir/languages"; fi
          (cd "$package_dir" && find . -type f ! -name SHA256SUMS | LC_ALL=C sort | xargs sha256sum > SHA256SUMS)
          (cd build && zip -qr "../${slug}.zip" "$slug")
          unzip -t "${slug}.zip"
          {
            echo "### Free plugin"
            echo "Download **shipping-cost-monitor-for-woocommerce-${GITHUB_SHA}** and upload that file directly in WordPress (Plugins → Add New → Upload Plugin). It already contains the \`${slug}/\` folder."
            echo ""
            echo "Integrity: \`${slug}/SHA256SUMS\` inside the artifact lists the SHA-256 of every packaged file. Check with \`cd ${slug} && sha256sum -c SHA256SUMS\`. Manifest SHA-256: \`$(sha256sum "${package_dir}/SHA256SUMS" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package Pro ZIP
        shell: bash
        run: |
          set -euo pipefail
          slug='shipping-cost-monitor-pro-for-woocommerce'
          package_dir="build-pro/${slug}"
          rm -rf build-pro "${slug}.zip"
          mkdir -p "$package_dir"
          cp -R pro/assets pro/includes pro/vendor "$package_dir/"
          cp pro/shipping-cost-monitor-pro-for-woocommerce.php pro/uninstall.php pro/changelog.txt pro/composer.json LICENSE "$package_dir/"
          printf '%s\n' "$GITHUB_SHA" > "$package_dir/BUILD-ID.txt"
          (cd "$package_dir" && find . -type f ! -name SHA256SUMS | LC_ALL=C sort | xargs sha256sum > SHA256SUMS)
          (cd build-pro && zip -qr "../${slug}.zip" "$slug")
          unzip -t "${slug}.zip"
          {
            echo "### Pro add-on"
            echo "Download **shipping-cost-monitor-pro-for-woocommerce-${GITHUB_SHA}** and upload that file directly in WordPress. It already contains the \`${slug}/\` folder."
            echo ""
            echo "Integrity: \`${slug}/SHA256SUMS\` inside the artifact lists the SHA-256 of every packaged file. Check with \`cd ${slug} && sha256sum -c SHA256SUMS\`. Manifest SHA-256: \`$(sha256sum "${package_dir}/SHA256SUMS" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Free ZIP
        uses: actions/upload-artifact@v7.0.1
        with:
          name: shipping-cost-monitor-for-woocommerce-${{ github.sha }}
          # GitHub always wraps an artifact in a ZIP. Uploading the build/ folder (which holds
          # shipping-cost-monitor-for-woocommerce/) makes that ZIP the installable plugin ZIP.
          path: build/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pro ZIP
        uses: actions/upload-artifact@v7.0.1
        with:
          name: shipping-cost-monitor-pro-for-woocommerce-${{ github.sha }}
          path: build-pro/
          if-no-files-found: error
          retention-days: 14
